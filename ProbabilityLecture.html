        /* CSS RESET & BOX MODEL */
        * {
            box-sizing: border-box; /* Critical: includes padding in width */
        }

        :root {
            --primary-color: #2c3e50;
            --accent-color: #e67e22;
            --text-color: #333;
            --border-color: #bdc3c7;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: var(--text-color);
        }

        /* WEB VIEW CONTAINER */
        .container {
            max-width: 750px; /* Narrower for better web-to-print translation */
            margin: 20px auto;
            background: #fff;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header {
            border-bottom: 2px solid var(--accent-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .formula-section {
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--accent-color);
            page-break-inside: avoid; /* Prevents splitting a rule across two pages */
        }

        .fill-in-box {
            border-bottom: 1.5px solid #000;
            display: inline-block;
            min-width: 150px;
            margin: 0 5px;
        }

        .problem-card {
            margin-bottom: 15px;
            padding: 12px;
            background: #fafafa;
            border: 1px solid #ddd;
        }

        .work-space {
            border: 1px solid #ccc;
            height: 80px;
            margin-top: 8px;
            background: #fff;
        }

        .print-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* PRINT OVERRIDES */
        @media print {
            @page {
                size: letter;
                margin: 0.5in; /* Standard safe printing margin */
            }
            
            body { background: white; }
            
            .container {
                width: 100% !important;
                max-width: 100% !important; /* Uses the full 0.5in margin area */
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none;
            }

            .print-btn { display: none; }
            
            h1 { font-size: 20pt; }
            h2 { font-size: 16pt; }
            h3 { font-size: 14pt; }
